name: Desktop release

# The app ships portable only (zip + single exe), so nothing here builds an
# installer. Windows runners still do the build so the exe is a native one.
#
# Every push to main builds. It publishes to R2 (and shows up on /download)
# when the version in apps/desktop/package.json changed in that push, on a
# desktop-v* tag, or on a manual run with publish checked — so ordinary commits
# never overwrite an already-published version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to apps/desktop/package.json)"
        required: false
      publish:
        description: "Upload to R2 and list on /download"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["desktop-v*"]

# Ordinary pushes to main supersede each other — the newest commit is the one
# worth building. Tags and manual runs get a group of their own so a publish is
# never cancelled by whatever lands next.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        && format('desktop-release-{0}', github.ref)
        || format('desktop-publish-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      # creating the GitHub Release and attaching artifacts to it
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # the publish decision compares this commit's version with its parent
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set version
        if: inputs.version != ''
        shell: pwsh
        run: |
          $p = "apps/desktop/package.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.version = "${{ inputs.version }}"
          $j | ConvertTo-Json -Depth 32 | Set-Content $p

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build portable (zip + single exe)
        run: pnpm -F @gsc/desktop dist
        env:
          # electron-builder publishes only when we ask it to
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify the artifacts were produced
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/release/*-portable.*
          if (-not $files) { throw "no portable artifacts produced" }
          foreach ($f in $files) { Write-Host "built $($f.Name) — $([math]::Round($f.Length/1MB)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: gamesavecloud-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          retention-days: 14

      - name: Decide whether to publish
        id: gate
        shell: pwsh
        run: |
          $publish = $false
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $publish = "${{ inputs.publish }}" -eq "true"
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/desktop-v")) {
            $publish = $true
          } else {
            $now = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
            # a first commit has no parent, and neither does a squashed checkout
            $before = git show "HEAD~1:apps/desktop/package.json" 2>$null
            $prev = if ($before) { ($before | ConvertFrom-Json).version } else { $null }
            $publish = ($prev -eq $null) -or ($prev -ne $now)
            Write-Host "version $prev -> $now"
          }
          Write-Host "publish=$publish"
          "publish=$($publish.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Publish to R2
        if: steps.gate.outputs.publish == 'true'
        run: pnpm release
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # The repo is private, so these assets need repo access to download —
      # /download stays the public route. This is the versioned archive, and it
      # tags the exact commit each build came from.
      - name: Publish a GitHub Release
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "desktop-v$version"

          # the changelog section for this version, if it has one
          $notesFile = "release-notes.md"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($version))( |$)" | Select-Object -First 1).LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $next = ($rest | Select-String -Pattern "^## " | Select-Object -First 1).LineNumber
            $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
            $body -join "`n" | Set-Content $notesFile
          } else {
            "Portable Windows build of gamesavecloud $version." | Set-Content $notesFile
          }

          $assets = (Get-ChildItem apps/desktop/release/* -Include *.zip,*.exe |
            Where-Object { $_.Name -like "*-$version-*" }).FullName
          if (-not $assets) { throw "no v$version artifacts to attach" }

          # re-running a publish replaces the assets rather than failing
          if (gh release view $tag 2>$null) {
            gh release edit $tag --title "gamesavecloud $version" --notes-file $notesFile
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title "gamesavecloud $version" --notes-file $notesFile --target $env:GITHUB_SHA
          }
          Write-Host "released $tag with $($assets.Count) assets"
