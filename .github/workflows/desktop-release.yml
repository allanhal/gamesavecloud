name: Desktop release

# The app ships portable only (zip + single exe), so nothing here builds an
# installer. Windows runners still do the build so the exe is a native one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to apps/desktop/package.json)"
        required: false
      publish:
        description: "Upload to R2 and list on /download"
        type: boolean
        default: false
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set version
        if: inputs.version != ''
        shell: pwsh
        run: |
          $p = "apps/desktop/package.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.version = "${{ inputs.version }}"
          $j | ConvertTo-Json -Depth 32 | Set-Content $p

      - name: Build portable (zip + single exe)
        run: pnpm -F @gsc/desktop dist
        env:
          # electron-builder publishes only when we ask it to
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify the artifacts were produced
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/release/*-portable.*
          if (-not $files) { throw "no portable artifacts produced" }
          foreach ($f in $files) { Write-Host "built $($f.Name) — $([math]::Round($f.Length/1MB)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: gamesavecloud-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          retention-days: 14

      - name: Publish to R2
        if: inputs.publish == true
        run: pnpm release
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
