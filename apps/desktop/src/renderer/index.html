<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>gamesavecloud</title>
<style>
  :root {
    --bg:#14161c; --panel:#1b1e26; --line:#2b3040; --ink:#e8eaf0;
    --muted:#8d94a8; --accent:#3ddc97; --warn:#e8b04b; --danger:#e5484d;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
  button { font:inherit; cursor:pointer; border-radius:8px; padding:6px 12px;
    border:1px solid var(--line); background:transparent; color:var(--ink); }
  button:hover:not(:disabled) { background:rgba(255,255,255,.06); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); color:#0b0f0d; border-color:transparent; font-weight:600; }
  button.danger { color:var(--danger); border-color:rgba(229,72,77,.4); }
  input { font:inherit; background:rgba(0,0,0,.25); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  input:focus { outline:none; border-color:var(--accent); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .muted { color:var(--muted); }
  .row { display:flex; align-items:center; gap:12px; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .mono { font-family:"Cascadia Mono",Consolas,monospace; font-size:12px; }
</style>
</head>
<body><div id="root"></div><script src="renderer.js"></script></body>
</html>
