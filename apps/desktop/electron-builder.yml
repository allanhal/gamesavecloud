# Ship one thing: a zip of the app for Windows x64. Extract it and run
# gamesavecloud.exe directly — no installer, no self-extraction, no auto-update.
# Data is kept in gamesavecloud-data beside the exe (portable).
appId: dev.gamesavecloud.desktop
productName: gamesavecloud
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
# ship beside the exe: the portable marker and the bundled recipe files
extraFiles:
  - portable.txt
win:
  target:
    - target: zip
      arch: [x64]
  artifactName: gamesavecloud-${version}-${arch}.${ext}
compression: normal
publish: null
