# Ship one thing: a single portable .exe for Windows x64. No installer, no
# auto-update. Data is kept in gamesavecloud-data beside the exe (portable).
appId: dev.gamesavecloud.desktop
productName: gamesavecloud
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
# ship beside the exe: the portable marker and the bundled recipe files
extraFiles:
  - portable.txt
win:
  target:
    - target: portable
      arch: [x64]
  artifactName: gamesavecloud-${version}-${arch}-portable.${ext}
compression: normal
publish: null
