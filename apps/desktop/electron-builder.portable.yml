# Portable artifacts: no installer, no auto-update, data kept beside the exe.
appId: dev.gamesavecloud.desktop
productName: gamesavecloud
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/js-yaml/**/*
  - node_modules/semver/**/*
  - node_modules/fs-extra/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/lazy-val/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
  - node_modules/argparse/**/*
  - node_modules/sax/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
# ships beside the exe and switches the app into portable mode
extraFiles:
  - portable.txt
win:
  target:
    - target: zip
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  artifactName: gamesavecloud-${version}-${arch}-portable.${ext}
portable:
  artifactName: gamesavecloud-${version}-${arch}-portable.${ext}
compression: normal
publish: null
